name: Build Sandi Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q SandiUniversalLauncher-Project.zip

      - name: Build APK
        working-directory: SandiUniversalLauncher
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SandiUniversalLauncher-APK
          path: SandiUniversalLauncher/app/build/outputs/apk/debug/app-debug.apk
